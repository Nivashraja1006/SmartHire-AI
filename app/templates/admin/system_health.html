{% extends "base.html" %}
{% block content %}<section class="dashboard-shell container"><div class="dashboard-heading reveal is-visible"><div><div class="eyebrow">Operations</div><h1 class="dashboard-title">System Health</h1><p class="dashboard-subtitle">Current application checks from the running environment.</p></div></div><div class="analytics-grid">{% for name, check in checks.items() %}<article class="dashboard-card analytics-panel"><div class="section-label">{{ name|replace('_', ' ')|title }}</div><div class="status-chip"><span></span>{{ check.status }}</div><p class="dashboard-subtitle">{{ check.detail }}</p></article>{% endfor %}</div></section>{% endblock %}
