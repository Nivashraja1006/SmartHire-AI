{% extends "base.html" %}
{% block content %}<section class="form-shell container"><div class="eyebrow">Interview management</div><h1>{{ title }}</h1><p class="dashboard-subtitle">Schedule a focused, conflict-free conversation.</p><form method="post" class="stack-form"><label>Application<select name="application_id" required {% if interview %}disabled{% endif %}>{% for application in applications %}<option value="{{ application.id }}" {% if interview and interview.application_id == application.id %}selected{% endif %}>{{ application.candidate.full_name }} · {{ application.job.title }}</option>{% endfor %}</select></label><div class="form-row"><label>Date<input type="date" name="interview_date" required value="{{ interview.interview_date.isoformat() if interview and interview.interview_date else '' }}"></label><label>Time<input type="time" name="interview_time" required value="{{ interview.interview_time.strftime('%H:%M') if interview and interview.interview_time else '' }}"></label><label>Duration (minutes)<input type="number" name="duration_minutes" min="1" max="480" value="{{ interview.duration_minutes if interview else 60 }}" required></label></div><label>Type<select name="interview_type">{% for item in interview_types %}<option {% if interview and interview.interview_type == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Meeting link<input type="url" name="meeting_link" value="{{ interview.meeting_link if interview else '' }}"></label><label>Location<input type="text" name="location" value="{{ interview.location if interview else '' }}"></label><label>Notes<textarea name="notes" rows="4">{{ interview.notes if interview else '' }}</textarea></label><button class="btn btn-primary" type="submit"><i class="fas fa-calendar-plus"></i> Save interview</button></form></section>{% endblock %}
